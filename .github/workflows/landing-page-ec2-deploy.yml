name: Build landing-page on GitHub Actions, deploy standalone to EC2

on:
  push:
    branches: [main]
    # Monorepo: paths: [ "landing-page/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            landing-page/package-lock.json
            package-lock.json

      - name: Ensure rsync + deploy dir on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            if ! command -v rsync >/dev/null 2>&1; then
              sudo dnf install -y rsync 2>/dev/null || sudo yum install -y rsync
            fi
            mkdir -p /home/ec2-user/main-web/landing-app

      - name: Build standalone (runner — avoids npm on small EC2)
        run: |
          set -euo pipefail
          if [ -d landing-page ]; then
            cd landing-page
          fi
          npm ci
          test -f node_modules/next/dist/bin/next || { echo "next missing after npm ci"; exit 1; }
          npm run build
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp ecosystem.config.cjs .next/standalone/ecosystem.config.cjs

      - name: Rsync standalone bundle to EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST_PROD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rsync
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -d landing-page ]; then
            SRC="landing-page/.next/standalone/"
          else
            SRC=".next/standalone/"
          fi
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            "$SRC" "ec2-user@${HOST}:/home/ec2-user/main-web/landing-app/"

      - name: PM2 on EC2 (Node only — no npm ci on instance)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            if ! command -v node >/dev/null 2>&1; then
              if command -v dnf >/dev/null 2>&1; then
                curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash -
                sudo dnf install -y nodejs
              elif command -v yum >/dev/null 2>&1; then
                curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash -
                sudo yum install -y nodejs
              elif command -v apt-get >/dev/null 2>&1; then
                curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
                sudo apt-get install -y nodejs
              else
                echo "ERROR: Install Node.js 20+ on this host manually (unsupported package manager)."
                exit 1
              fi
            fi
            node -v
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi
            cd /home/ec2-user/main-web/landing-app
            test -f server.js || { echo "server.js missing in landing-app"; exit 1; }
            pm2 delete landing-page 2>/dev/null || true
            pm2 start ecosystem.config.cjs
            pm2 save
