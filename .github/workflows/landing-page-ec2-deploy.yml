name: Build landing-page on EC2 (production, non-Docker)

on:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/landing-page-ec2-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rsync source to EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST_PROD }}
        run: |
          set -euo pipefail
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y rsync
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.git' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            ./landing-page/ "ec2-user@${HOST}:/home/ec2-user/landing-page/"

      - name: Install deps, build, restart PM2 on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/ec2-user/landing-page
            if ! command -v node >/dev/null 2>&1; then
              echo "ERROR: Node.js is not installed on EC2. Install Node 20+ (see school-erp-infra AWS guide + landing deploy steps)."
              exit 1
            fi
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "ERROR: pm2 is not installed. Run: sudo npm install -g pm2"
              exit 1
            fi
            npm ci
            npm run build
            if pm2 describe landing-page >/dev/null 2>&1; then
              pm2 restart landing-page --update-env
            else
              pm2 start ecosystem.config.cjs
            fi
            pm2 save
