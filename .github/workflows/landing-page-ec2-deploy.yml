name: Build landing-page on EC2 (production, non-Docker)

on:
  push:
    branches: [main]
    # Monorepo (app in subfolder): add e.g. paths: [ "landing-page/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # rsync over SSH needs the rsync binary on the remote host (EC2), not only on the runner.
      - name: Ensure rsync on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            if ! command -v rsync >/dev/null 2>&1; then
              sudo dnf install -y rsync 2>/dev/null || sudo yum install -y rsync
            fi

      - name: Rsync source to EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST_PROD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rsync
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # Monorepo: sync ./landing-page/ — standalone repo: sync repo root (./)
          if [ -d "./landing-page" ]; then
            RSYNC_SRC="./landing-page/"
          else
            RSYNC_SRC="./"
          fi
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.git' \
            --exclude '.github' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            "$RSYNC_SRC" "ec2-user@${HOST}:/home/ec2-user/landing-page/"

      - name: Install deps, build, restart PM2 on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/ec2-user/landing-page
            if ! command -v node >/dev/null 2>&1; then
              if command -v dnf >/dev/null 2>&1; then
                curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash -
                sudo dnf install -y nodejs
              elif command -v yum >/dev/null 2>&1; then
                curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash -
                sudo yum install -y nodejs
              elif command -v apt-get >/dev/null 2>&1; then
                curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
                sudo apt-get install -y nodejs
              else
                echo "ERROR: Install Node.js 20+ on this host manually (unsupported package manager)."
                exit 1
              fi
            fi
            node -v
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi
            npm ci
            npm run build
            if pm2 describe landing-page >/dev/null 2>&1; then
              pm2 restart landing-page --update-env
            else
              pm2 start ecosystem.config.cjs
            fi
            pm2 save
